<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="shortcut icon" href="./images/bear.png" type="image/x-icon">
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="./main.css">
  <script src="https://kit.fontawesome.com/6a4a3ce349.js" crossorigin="anonymous" defer></script>
  <title>미니홈피</title>
</head>
<body>
  <div class="container">
    <main>
      <!-- 프로필 섹션 -->
      <section class="profile">
        <div class="today-total">
          <span>TODAY</span>
          <span>TOTAL</span>
        </div>
        <div class="profile-inner">
          <div class="profile-img"></div>
          <div class="profile-line"></div>
          <div class="profile-today"><span>TODAY IS ...</span>☁️ HAPPY ☁️</div>
          <div class="profile-txt">
            <P>안녀하새오.</P>
            <P>곰도리애오.</P>
          </div>
          <div class="profile-info">
            <a href="tel:+89 010 000 0000"><i class="fa-brands fa-apple"></i>010 000 0000</a>
            <a href="mailto:bear@mail.com"><i class="fa-solid fa-paper-plane small"></i>bear @ mail.com</a>
          </div>
          <select name="profile-sns" id="profile-sns">
            <option value="waves">파도타기</option>
            <option value="instagram">인스타</option>
            <option value="github">깃허브</option>
            <option value="notion">노션</option>
          </select>
        </div>

      <!-- 콘텐츠 섹션 -->
      </section>
      <!-- <div class="white-space"></div> -->
      <section class="contents">
        <h1 class="main-title">🧸 곰도리애 하루</h1>

        <!-- 탭 메뉴 -->
        <div class="contents-tab">
          <input type="radio" name="tab-menu" id="tab-home" checked>
          <label for="tab-home">홈</label>

          <input type="radio" name="tab-menu" id="tab-profile">
          <label for="tab-profile">프로필</label>

          <input type="radio" name="tab-menu" id="tab-diary">
          <label for="tab-diary">다이어리</label>

          <input type="radio" name="tab-menu" id="tab-photos">
          <label for="tab-photos">사진첩</label>

          <input type="radio" name="tab-menu" id="tab-guestbook">
          <label for="tab-guestbook">방명록</label>
        </div>

        <!-- 탭 콘텐츠 -->
        <div class="contents-inner">
          <!-- 홈 -->
          <div class="home-container">
            <div class="contents-top">
              <div class="content-news">
                <p class="category">Updated news</p>
                <ul>
                  <li>안녕히 계세요 여러분~!</li>
                  <li>전 이 세상의 모든</li>
                  <li>굴레와 속박을 벗어던지고</li>
                  <li>제 행복을 찾아 떠납니다</li>
                </ul>
              </div>
              <div class="contents-right">
                <div class="content-cnt">
                  <p>게시글<span>0</span></p>
                  <p>다이어리<span>0</span></p>
                  <p>사진첩<span>0</span></p>
                  <p>방명록<span>0</span></p>
                </div>
                <div class="content-img"><span>🩵 💙 🩵 💙</span></div>
                <!-- <div class="content-bgm">
                  <p class="category">BGM</p>
                </div> -->
              </div>
            </div>
            <div class="content-room">
              <p class="category">Mini Room</p>
              <div class="room-img"></div>
            </div>
            <div class="content-friends">
              <p class="category">friends say</p>
              <ul>
                <li>1</li>
                <li>2</li>
              </ul>
            </div>
          </div>

          <!-- 프로필 -->
          <div class="profile-container">
            
          </div>

          <!-- 다이어리 -->
          <div class="diary-container">
            준비중입니다 🧸
          </div>

          <!-- 사진첩 -->
          <div class="photos-container"></div>

          <!-- 방명록 -->
          <div class="guestbook-container">
            준비중입니다 🧸
          </div>
        </div>
      </section>
    </main>
  </div>
</body>
</html>
